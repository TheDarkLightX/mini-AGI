name: continual-v2-check

on:
  push:
    branches:
      - continual-v2-router-replay
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m py_compile train.py minagi/*.py corpora/*.py serve.py
      - name: Verify V2 hooks are present
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          text = Path("train.py").read_text()
          tree = ast.parse(text)
          names = {n.name for n in ast.walk(tree)
                   if isinstance(n, (ast.FunctionDef, ast.ClassDef))}
          assert "_ReplayMemory" in names
          assert "_split_trunk_router_experts" in names
          assert "--router-lr-mult" in text
          assert "--replay-state" in text
          print("continual-v2 static invariants: OK")
          PY
